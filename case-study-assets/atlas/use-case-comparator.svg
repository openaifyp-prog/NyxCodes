<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="600" height="300" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* System fonts for compatibility */
    .slot { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2px; }
    .slot-active { stroke: #fbbf24; stroke-width: 3px; }
    .text-label { font-family: 'Times New Roman', serif; fill: #64748b; font-size: 14px; text-anchor: middle; }
    .text-country { font-family: 'Arial', sans-serif; fill: #0f172a; font-weight: 700; font-size: 16px; text-anchor: middle; }
    .btn { fill: #0f172a; rx: 20px; }
    .btn-text { fill: #fbbf24; font-family: 'Arial', sans-serif; font-weight: 700; font-size: 13px; text-anchor: middle; letter-spacing: 1px; }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafc" opacity="0" />

  <!-- Slot 1 (Filled) -->
  <g transform="translate(50, 75)">
    <rect width="140" height="150" rx="8" class="slot slot-active" />
    <circle cx="70" cy="50" r="25" fill="#e2e8f0" />
    <text x="70" y="55" font-size="20">🇧🇷</text>
    <text x="70" y="100" class="text-country">Brazil</text>
    <text x="70" y="125" class="text-label">Selected</text>
  </g>

  <!-- Plus Icon -->
  <circle cx="270" cy="150" r="15" fill="#e2e8f0" />
  <path d="M263 150 H277 M270 143 V157" stroke="#64748b" stroke-width="2" stroke-linecap="round" />

  <!-- Slot 2 (Empty) -->
  <g transform="translate(350, 75)">
    <rect width="140" height="150" rx="8" class="slot" stroke-dasharray="8 4" />
    <text x="70" y="80" class="text-label" fill="#94a3b8">Select Country</text>
    <text x="70" y="100" class="text-country" fill="#cbd5e1">Empty</text>
  </g>

  <!-- Action Button -->
  <g transform="translate(200, 250)">
    <rect x="-10" y="0" width="160" height="40" class="btn" />
    <text x="70" y="25" class="btn-text">COMPARE</text>
  </g>

  <!-- Logic Lines -->
  <path d="M190 150 H250 M290 150 H350" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4" />

</svg>
