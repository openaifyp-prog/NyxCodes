<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Case Study</title>

    <!-- Core Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Styles -->
    <style>
        :root {
            --primary: #0f172a;
            --font-display: 'Playfair Display', serif;
            --font-body: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            color: #1e293b;
            background: #f8fafc;
            overflow-x: hidden;
        }

        /* --- 1. ROBUST NAVIGATION --- */
        .nav-bar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1200px;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 100px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-bar.scrolled {
            top: 0;
            width: 100%;
            max-width: none;
            border-radius: 0;
            background: rgba(255, 255, 255, 0.95);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .nav-progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(0, 0, 0, 0.02);
            overflow: hidden;
            border-bottom-left-radius: 100px;
            border-bottom-right-radius: 100px;
        }

        .nav-bar.scrolled .nav-progress-container {
            border-radius: 0;
        }

        #nav-progress {
            height: 100%;
            width: 0%;
            background: var(--primary);
            transition: width 0.1s ease-out;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex: 1;
        }

        .nav-center {
            flex: 1;
            display: flex;
            justify-content: center;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease;
        }

        .nav-center.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .nav-project-title {
            font-family: var(--font-display);
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 250px;
        }

        .nav-right {
            display: flex;
            justify-content: flex-end;
            flex: 1;
        }

        .nav-back {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #334155;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 8px 20px;
            border-radius: 50px;
            background: rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        .nav-back:hover {
            background: rgba(0, 0, 0, 0.06);
            transform: translateX(-3px);
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
            padding: 10px 24px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(15, 23, 42, 0.25);
        }

        @media (max-width: 768px) {
            .nav-bar {
                top: 10px;
                padding: 0 1rem;
                height: 60px;
            }

            .nav-center {
                display: none;
            }

            .nav-back span {
                display: none;
            }

            .nav-back {
                padding: 8px 12px;
            }

            .btn-primary {
                padding: 8px 16px;
                font-size: 0.8rem;
            }
        }

        .nav-back {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #334155;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 50px;
            background: #f1f5f9;
            transition: all 0.2s;
        }

        .nav-back:hover {
            background: #e2e8f0;
            transform: translateX(-2px);
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
            padding: 10px 24px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2);
            transition: transform 0.2s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
        }

        /* --- 2. SPLIT HERO (Unbreakable Layout) --- */
        .hero {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            min-height: 90vh;
            padding: 120px 5% 4rem;
            max-width: 1400px;
            margin: 0 auto;
            gap: 4rem;
            align-items: center;
        }

        .hero-text {
            z-index: 2;
        }

        h1 {
            font-family: var(--font-display);
            font-size: clamp(3rem, 5vw, 4.5rem);
            line-height: 1.1;
            margin-bottom: 1.5rem;
            color: var(--primary);
        }

        .hero-intro {
            font-size: 1.2rem;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 2rem;
            max-width: 500px;
        }

        /* The Robust Visual Container */
        .hero-visual-container {
            position: relative;
            aspect-ratio: 16/10;
            /* Ensures space is reserved even if img fails */
            background: #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.15);
        }

        .hero-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0;
            animation: fadeIn 0.5s forwards;
        }

        .tags-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .tag {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 6px 14px;
            border-radius: 20px;
            background: #fff;
            border: 1px solid #e2e8f0;
            color: #64748b;
            font-weight: 600;
        }

        /* --- 3. BENTO DATA GRID --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            padding: 4rem 5%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .stat-card {
            background: #fff;
            padding: 2.5rem;
            border-radius: 16px;
            border: 1px solid #f1f5f9;
        }

        .label {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--primary);
            opacity: 0.6;
            display: block;
            margin-bottom: 1rem;
        }

        /* --- 4. USE CASES --- */
        .use-case-wrapper {
            padding: 4rem 5%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .feature-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            margin-bottom: 8rem;
            align-items: center;
        }

        .feature-row:nth-child(even) .visual-col {
            order: -1;
        }

        /* Swap for zig-zag */

        .visual-col {
            aspect-ratio: 4/3;
            background: #f8fafc;
            border-radius: 12px;
            border: 2px dashed #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .visual-col img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        @media (max-width: 900px) {

            .hero,
            .feature-row {
                grid-template-columns: 1fr;
            }

            .feature-row:nth-child(even) .visual-col {
                order: 0;
            }

            h1 {
                font-size: 2.5rem;
            }
        }

        /* Loading State */
        .skeleton {
            background: #cbd5e1;
            color: transparent;
            border-radius: 4px;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <!-- 1. Navigation -->
    <nav class="nav-bar" id="main-nav">
        <div class="nav-left">
            <a href="projects.html" class="nav-back">
                <i class="fa-solid fa-arrow-left"></i> <span>Back</span>
            </a>
        </div>

        <div class="nav-center" id="nav-title-container">
            <span class="nav-project-title" id="nav-project-name">Project Title</span>
        </div>

        <div class="nav-right">
            <a href="#" id="btn-live" class="btn-primary" target="_blank">View Live Site</a>
        </div>

        <div class="nav-progress-container">
            <div id="nav-progress"></div>
        </div>
    </nav>

    <!-- 2. Split Hero -->
    <header class="hero">
        <div class="hero-text">
            <div class="tags-container" id="hero-tags">
                <!-- Fallback Tags -->
                <span class="tag">Loading...</span>
            </div>
            <h1 id="hero-title">Loading Project...</h1>
            <p class="hero-intro" id="hero-intro">Please wait while the case study logic retrieves the project details.
            </p>
        </div>
        <div class="hero-visual-container">
            <img id="hero-img" src="" alt="Project Preview" class="hero-img"
                onerror="this.style.display='none'; this.parentElement.style.background='#cbd5e1 url(data:image/svg+xml;base64,...) center no-repeat'">
        </div>
    </header>

    <!-- 3. Stats Grid -->
    <section class="stats-grid">
        <div class="stat-card">
            <span class="label">Challenge</span>
            <h3 style="font-size: 1.5rem; margin-bottom: 1rem;">The Objective</h3>
            <p id="challenge-text" style="color: #64748b; line-height: 1.6;">...</p>
        </div>
        <div class="stat-card">
            <span class="label">Solution</span>
            <h3 style="font-size: 1.5rem; margin-bottom: 1rem;">Our Approach</h3>
            <p id="solution-text" style="color: #64748b; line-height: 1.6;">...</p>
        </div>
        <div class="stat-card" style="background: #1e293b; color: #fff;">
            <span class="label" style="color: #94a3b8;">Key Results</span>
            <ul id="results-list" style="margin-top: 1rem; padding-left: 1.2rem; line-height: 1.8;">
                <li>...</li>
            </ul>
        </div>
    </section>

    <!-- 4. Feature Logic -->
    <section class="use-case-wrapper" id="use-cases">
        <!-- Injected Features will go here -->
    </section>


    <script src="case-study-data.js"></script>
    <script src="case-study.js"></script>
</body>

</html>
