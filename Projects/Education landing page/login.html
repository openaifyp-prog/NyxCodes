<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Education Landing Page</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .auth-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .auth-header {
            margin-bottom: 30px;
        }

        .auth-header .logo-icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 10px;
        }

        .auth-header h2 {
            font-size: 1.8rem;
            color: var(--text-dark);
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-light);
            /* Fixed variable name */
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-family: inherit;
        }

        .form-group input:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        .btn-auth {
            width: 100%;
            margin-top: 10px;
        }

        .auth-footer {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #666;
        }

        .auth-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .auth-container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="auth-container">
        <div class="auth-header">
            <span class="logo-icon">🎓</span>
            <h2>Welcome Back</h2>
            <p>Please log in to continue</p>
        </div>
        <form>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="name@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-main btn-auth">Log In</button>
        </form>
        <div class="auth-footer">
            Don't have an account? <a href="signup.html">Sign Up</a>
            <br>
            <a href="index.html" style="display: inline-block; margin-top: 10px; font-size: 0.8rem; color: #999;">&larr;
                Back to Home</a>
        </div>
    </div>

</body>

</html>
