<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Education Landing Page</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .contact-form-container {
            background-color: #fff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            max-width: 600px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-dark);
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--primary-color);
            outline: none;
        }
    </style>
</head>

<body>

    <header class="header">
        <nav class="navbar container">
            <a href="index.html" class="logo">
                <span class="logo-icon">🎓</span>
                Lars Petters
            </a>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="courses.html">Courses</a></li>
                <li><a href="contact.html" class="active">Contact Us</a></li>
            </ul>
            <div class="nav-actions">
                <a href="#" class="nav-login-link">Log In</a>
                <a href="#" class="btn btn-main">Sign Up</a>
            </div>
            <div class="menu-toggle">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero" style="min-height: auto; padding-bottom: 40px;">
            <div class="container text-center">
                <h1 class="hero-title" style="font-size: 3rem;">Get In <span
                        style="background-color: var(--primary-color); color: #fff; padding: 0 10px; border-radius: 8px;">Touch</span>
                </h1>
                <p class="hero-description" style="margin: 0 auto;">Have questions? We'd love to hear from you.</p>
            </div>
        </section>

        <section style="padding: 40px 0 80px;">
            <div class="container">
                <div class="contact-form-container">
                    <form>
                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" placeholder="Your Name">
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" placeholder="Your Email">
                        </div>
                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea id="message" rows="5" placeholder="How can we help?"></textarea>
                        </div>
                        <button type="submit" class="btn btn-main" style="width: 100%; border-radius: 8px;">Send
                            Message</button>
                    </form>
                </div>
            </div>
        </section>

    </main>

    <footer class="footer">
        <div class="container footer-container">
            <div class="footer-col">
                <a href="index.html" class="logo">
                    <span class="logo-icon">🎓</span>
                    Lars Petters
                </a>
                <p>Quality Courses At Affordable Prices.</p>
            </div>
            <div class="footer-col">
                <h4>Company</h4>
                <ul>
                    <li><a href="about.html">About us</a></li>
                    <li><a href="courses.html">Courses</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
        <div class="footer-bottom">
            <p>Copyright 2025 all rights Lars Petters reserved</p>
        </div>
    </footer>
    <script src="script.js"></script>
</body>

</html>
