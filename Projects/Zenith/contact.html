<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Zenith</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Montserrat:wght@200;300;400;500&display=swap"
        rel="stylesheet">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f5f5f0;
            color: #1a1a1a;
        }

        h1,
        h2,
        h3,
        h4 {
            font-family: 'Cormorant Garamond', serif;
        }
    </style>
</head>

<body class="overflow-x-hidden flex flex-col min-h-screen">

    <nav
        class="fixed top-0 w-full z-50 flex justify-between items-center px-8 md:px-16 py-8 mix-blend-difference text-white">
        <a href="index.html" class="text-2xl tracking-[0.2em] font-light z-50">ZENITH</a>
        <div class="hidden md:flex gap-12 text-sm tracking-widest uppercase">
            <a href="index.html" class="hover:border-b hover:border-black transition-all">Projects</a>
            <a href="studio.html" class="hover:border-b hover:border-black transition-all">Studio</a>
            <a href="news.html" class="hover:border-b hover:border-black transition-all">News</a>
            <a href="contact.html" class="border-b border-black">Contact</a>
        </div>
        <!-- Mobile Toggle -->
        <button id="mobile-toggle" class="md:hidden z-50 text-white mix-blend-difference focus:outline-none">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16">
                </path>
            </svg>
        </button>
    </nav>

    <!-- Mobile Menu Overlay -->
    <div id="mobile-menu"
        class="fixed inset-0 bg-[#1a1a1a] z-40 flex flex-col justify-center items-center opacity-0 pointer-events-none transition-opacity duration-500">
        <nav class="flex flex-col gap-8 text-center text-white text-2xl font-serif italic">
            <a href="index.html" class="mobile-link">Projects</a>
            <a href="studio.html" class="mobile-link">Studio</a>
            <a href="news.html" class="mobile-link">Journal</a>
            <a href="contact.html" class="mobile-link">Contact</a>
        </nav>
    </div>

    <script>
        const mobileToggle = document.getElementById('mobile-toggle');
        const mobileMenu = document.getElementById('mobile-menu');
        const mobileLinks = document.querySelectorAll('.mobile-link');
        let isMenuOpen = false;

        mobileToggle.addEventListener('click', () => {
            isMenuOpen = !isMenuOpen;
            if (isMenuOpen) {
                mobileMenu.classList.remove('opacity-0', 'pointer-events-none');
                mobileMenu.classList.add('opacity-100', 'pointer-events-auto');
                document.body.style.overflow = 'hidden';
                mobileToggle.innerHTML = '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path></svg>';
            } else {
                mobileMenu.classList.remove('opacity-100', 'pointer-events-auto');
                mobileMenu.classList.add('opacity-0', 'pointer-events-none');
                document.body.style.overflow = '';
                mobileToggle.innerHTML = '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16"></path></svg>';
            }
        });
    </script>

    <main class="flex-grow flex items-center justify-center pt-32 pb-20 px-6">
        <div class="max-w-4xl w-full grid grid-cols-1 md:grid-cols-2 gap-16">
            <div>
                <h1 class="text-6xl md:text-7xl italic mb-8">Get in Touch</h1>
                <p class="text-xl font-light leading-relaxed mb-12">
                    We are always looking for ambitious projects and collaborative partners. Tell us about your vision.
                </p>

                <div class="space-y-8">
                    <div>
                        <h4 class="text-sm tracking-widest uppercase font-bold mb-2">Office</h4>
                        <p class="font-light">123 Design District<br>Copenhagen, Denmark</p>
                    </div>
                    <div>
                        <h4 class="text-sm tracking-widest uppercase font-bold mb-2">Email</h4>
                        <a href="mailto:hello@zenith.com" class="font-light hover:underline">hello@zenith.com</a>
                    </div>
                </div>
            </div>

            <form id="zenith-contact-form" class="space-y-6">
                <div>
                    <label class="block text-xs uppercase tracking-widest mb-2">Name</label>
                    <input type="text" name="user_name"
                        class="w-full bg-transparent border-b border-gray-400 py-2 outline-none focus:border-black transition-colors"
                        required>
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-widest mb-2">Email</label>
                    <input type="email" name="user_email"
                        class="w-full bg-transparent border-b border-gray-400 py-2 outline-none focus:border-black transition-colors"
                        required>
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-widest mb-2">Message</label>
                    <textarea name="message" rows="4"
                        class="w-full bg-transparent border-b border-gray-400 py-2 outline-none focus:border-black transition-colors"
                        required></textarea>
                </div>
                <button type="submit" id="zenith-submit-btn"
                    class="bg-black text-white px-8 py-3 text-xs tracking-widest uppercase hover:bg-gray-800 transition-colors">
                    Send Message
                </button>
            </form>
        </div>
    </main>

    <footer class="bg-[#1a1a1a] text-white py-12 text-center text-xs tracking-widest uppercase">
        &copy; 2026 Zenith Architecture
    </footer>

    <script src="../../email-service.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('zenith-submit-btn');
            handleContactForm('zenith-contact-form', 'service_default', 'template_default', btn);
        });
    </script>

</body>

</html>
