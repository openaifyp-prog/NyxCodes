<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoinPulse | Live Crypto Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #0b0e14;
            color: #e2e8f0;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .neon-glow {
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.15);
        }

        .positive {
            color: #10b981;
        }

        .negative {
            color: #ef4444;
        }
    </style>
</head>

<body class="overflow-x-hidden min-h-screen pb-12">

    <!-- Navigation -->
    <nav class="border-b border-white/5 bg-[#0b0e14]/80 backdrop-blur-md fixed w-full z-50">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-indigo-500 flex items-center justify-center font-bold text-white">C
                </div>
                <span class="text-xl font-bold tracking-tight">CoinPulse</span>
            </div>
            <div class="flex items-center gap-4 text-sm text-gray-400">
                <span id="connection-status" class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> Live
                </span>
                <span id="last-updated">Updated: Just now</span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-6 pt-24">

        <!-- Header -->
        <header class="mb-12">
            <h1
                class="text-4xl md:text-5xl font-bold mb-4 bg-gradient-to-r from-white to-gray-500 bg-clip-text text-transparent">
                Market Overview</h1>
            <p class="text-gray-400">Real-time cryptocurrency prices and market analytics.</p>
        </header>

        <!-- Top Coins Grid -->
        <div id="price-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-12">
            <!-- Cards Injected via JS -->
            <div class="glass-panel rounded-2xl p-6 animate-pulse h-40"></div>
            <div class="glass-panel rounded-2xl p-6 animate-pulse h-40"></div>
            <div class="glass-panel rounded-2xl p-6 animate-pulse h-40"></div>
            <div class="glass-panel rounded-2xl p-6 animate-pulse h-40"></div>
        </div>

        <!-- Main Chart Section -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Chart Container -->
            <div class="lg:col-span-2 glass-panel rounded-2xl p-6 neon-glow">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h3 class="text-xl font-bold">Bitcoin Price Trend</h3>
                        <p class="text-sm text-gray-400">24 Hour Performance</p>
                    </div>
                    <div class="flex gap-2">
                        <button
                            class="px-3 py-1 rounded-lg bg-indigo-500/20 text-indigo-400 text-xs font-bold border border-indigo-500/30">24H</button>
                    </div>
                </div>
                <div class="h-[400px] w-full relative">
                    <canvas id="mainChart"></canvas>
                </div>
            </div>

            <!-- Market Stats / Trending -->
            <div class="space-y-6">
                <!-- Global Stats -->
                <div class="glass-panel rounded-2xl p-6">
                    <h3 class="font-bold mb-4 flex items-center gap-2">
                        <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
                        </svg>
                        Market Variance
                    </h3>
                    <div class="space-y-4">
                        <div class="flex justify-between items-center pb-4 border-b border-white/5">
                            <span class="text-gray-400 text-sm">Fear & Greed</span>
                            <span class="text-indigo-400 font-bold">64 (Greed)</span>
                        </div>
                        <div class="flex justify-between items-center pb-4 border-b border-white/5">
                            <span class="text-gray-400 text-sm">Dominance</span>
                            <span class="text-white font-bold">BTC: 52%</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-gray-400 text-sm">Active Currencies</span>
                            <span class="text-white font-bold">12,402</span>
                        </div>
                    </div>
                </div>

                <!-- Trending List -->
                <div class="glass-panel rounded-2xl p-6">
                    <h3 class="font-bold mb-4 text-purple-400">Trending Now 🔥</h3>
                    <div id="trending-list" class="space-y-4">
                        <div class="h-12 bg-white/5 rounded animate-pulse"></div>
                        <div class="h-12 bg-white/5 rounded animate-pulse"></div>
                        <div class="h-12 bg-white/5 rounded animate-pulse"></div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script src="dashboard.js"></script>
</body>

</html>
