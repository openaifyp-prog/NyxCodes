<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | The Nook</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo">
                    The Nook<span style="color:var(--accent);">.</span>
                </a>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="rooms.html">Bunks & Rooms</a></li>
                    <li><a href="index.html#vibe">The Vibe</a></li>
                    <li><a href="contact.html" class="active">Contact</a></li>
                </ul>
                <a href="rooms.html" class="btn-book">Book a Stay</a>
            </nav>
        </div>
    </header>

    <section class="hero" style="min-height: 80vh; padding-top: 100px;">
        <div class="container">
            <div style="max-width: 500px;">
                <h1 style="font-family: var(--font-heading); font-size: 3.5rem; line-height: 1.1; margin-bottom: 20px;">
                    Say <span style="font-style: italic; color: var(--primary);">Hello.</span></h1>
                <p style="font-size: 1.2rem; margin-bottom: 40px; color: var(--text-muted);">Have questions about
                    surfing, transfers, or availability? Drop us a line.</p>

                <div style="display: flex; flex-direction: column; gap: 20px; margin-bottom: 40px;">
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <div
                            style="width: 40px; height: 40px; background: #E0F2F1; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                            📍</div>
                        <p style="margin: 0;">Jalan Pantai Batu Bolong, Canggu, Bali</p>
                    </div>
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <div
                            style="width: 40px; height: 40px; background: #E0F2F1; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                            📧</div>
                        <p style="margin: 0;">hello@thenookbali.com</p>
                    </div>
                </div>
            </div>

            <div style="background: white; padding: 40px; border-radius: 20px; box-shadow: var(--shadow-soft);">
                <form>
                    <div style="margin-bottom: 20px;">
                        <label
                            style="display: block; margin-bottom: 8px; font-weight: 700; font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted);">Name</label>
                        <input type="text" placeholder="Your Name"
                            style="width: 100%; padding: 15px; border: 1px solid var(--border-color); border-radius: 8px; font-family: var(--font-body);">
                    </div>
                    <div style="margin-bottom: 20px;">
                        <label
                            style="display: block; margin-bottom: 8px; font-weight: 700; font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted);">Email</label>
                        <input type="email" placeholder="Your Email"
                            style="width: 100%; padding: 15px; border: 1px solid var(--border-color); border-radius: 8px; font-family: var(--font-body);">
                    </div>
                    <div style="margin-bottom: 20px;">
                        <label
                            style="display: block; margin-bottom: 8px; font-weight: 700; font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted);">Message</label>
                        <textarea placeholder="Tell us what's on your mind..."
                            style="width: 100%; padding: 15px; border: 1px solid var(--border-color); border-radius: 8px; font-family: var(--font-body); height: 150px;"></textarea>
                    </div>
                    <button class="btn-book" style="width: 100%; cursor: pointer; border: none;">Send Message</button>
                </form>
            </div>
        </div>
    </section>

</body>

</html>
