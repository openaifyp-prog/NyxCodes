name: codemaze
description: A clean Flutter reset of CodeMaze
publish_to: 'none'

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.13.0
  video_player: ^2.7.0
  firebase_auth: ^5.5.3
  firebase_database: ^11.3.6
  url_launcher: ^6.1.7
  provider: ^6.1.5
  http: ^0.13.6
  shared_preferences: ^2.2.2
  shared_preferences_web: ^2.0.4
  webview_flutter: ^4.2.4
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/tcc/tcc.exe
    - assets/lessons_seed.json
    - assets/data/lessons.json
    - assets/data/quizzes.json
    - assets/data/puzzles.json
    - assets/videos/lesson1.mp4
    - assets/avatars/

